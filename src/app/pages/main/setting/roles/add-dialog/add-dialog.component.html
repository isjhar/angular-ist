<form [formGroup]="formGroup" (ngSubmit)="onSubmitted()">
  <div mat-dialog-title i18n="role">Role</div>
  <mat-dialog-content class="mat-typography">
    <div class="flex flex-col">
      <mat-form-field appearance="fill">
        <mat-label i18n="name">Name</mat-label>
        <input matInput formControlName="name" required data-test="name" />
        <mat-error>
          <app-form-error-required name="name"></app-form-error-required>
        </mat-error>
      </mat-form-field>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <div class="gap-xs flex flex-row">
      <button
        matButton
        mat-dialog-close
        data-test="btn-cancel-form"
        i18n="cancel">
        <mat-icon>cancel</mat-icon>
        Cancel
      </button>
      <app-loading-button
        data-test="btn-save-form"
        [disabled]="!formGroup.valid"
        [isLoading]="isLoading"
        i18n="save"
        icon="save">
        Save
      </app-loading-button>
    </div>
  </mat-dialog-actions>
</form>
