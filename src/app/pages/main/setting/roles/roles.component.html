<div class="align-compact gap-md flex flex-col">
  <app-server-side-table #table [searchable]="true">
    <ng-template appDefaultTableTopActionContainer>
      <div *appHasAccessControl="AccessControlId.CreateRole">
        <button
          data-test="btn-add-role-list"
          matButton="filled"
          (click)="onTambahClicked()"
          i18n="add">
          <mat-icon>add</mat-icon>
          Add
        </button>
      </div>
    </ng-template>
    <ng-template appDefaultTableMobileItemView let-data>
      <mat-card
        matRipple
        class="clickable-card relative"
        (click)="onRowClicked(data)"
        tabindex="0">
        <mat-card-content>
          <div class="flex flex-row items-center">
            <div class="flex-1">{{ data.name }}</div>

            @if (data.isEditable) {
              <ng-container
                *ngTemplateOutlet="
                  actionTemplate;
                  context: {
                    element: data,
                  }
                "></ng-container>
            }
          </div>
        </mat-card-content>
      </mat-card>
    </ng-template>
    <ng-template appDefaultTableActionContainer let-data>
      <div class="mt-[6px]">
        <ng-container
          *ngTemplateOutlet="
            actionTemplate;
            context: {
              element: data,
            }
          "></ng-container>
      </div>
    </ng-template>
  </app-server-side-table>
</div>

<ng-template #actionTemplate let-element="element">
  <a
    [routerLink]="[element.id]"
    matIconButton
    i18n-aria-label="deleteIconAriaLabel"
    aria-label="Icon button with a delete icon"
    data-test="btn-detail">
    <mat-icon fontSet="material-symbols-outlined">visibility</mat-icon>
  </a>
  @if (element.isEditable) {
    <button
      *appHasAccessControl="AccessControlId.DeleteRole"
      matIconButton
      i18n-aria-label="deleteIconAriaLabel"
      aria-label="Icon button with a delete icon"
      data-test="btn-delete"
      (click)="onDeleteClicked($event, element)">
      <mat-icon fontSet="material-symbols-outlined">delete</mat-icon>
    </button>
  }
</ng-template>
