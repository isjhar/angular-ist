<div class="flex h-full w-full flex-col place-content-center items-center">
  <div class="flex w-full justify-end p-4">
    <app-localization-menu></app-localization-menu>
  </div>
  <div class="flex flex-1 flex-col place-content-center items-center px-6">
    <h1 i18n="welcomeToApp" class="text-display-small">Welcome to App</h1>
    <form
      class="flex w-full max-w-[500px] flex-col place-content-center p-6"
      [formGroup]="loginForm"
      (ngSubmit)="onLoginformSubmitted()">
      <mat-form-field appearance="fill" class="mb-2">
        <mat-label i18n="email">Email</mat-label>
        <input
          matInput
          type="email"
          name="email"
          id="email"
          formControlName="email"
          autocomplete="email"
          data-test="email" />
        <mat-error>
          <app-form-error-required name="email"></app-form-error-required>
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label i18n="password">Password</mat-label>
        <input
          matInput
          type="password"
          name="password"
          id="password"
          formControlName="password"
          autocomplete="current-password"
          data-test="password" />

        <button
          matIconButton
          matSuffix
          appTogglePassword
          type="button"
          i18n-aria-label="togglePasswordVisibility@@togglePasswordVisibility"
          aria-label="Toggle password visibility">
          <mat-icon></mat-icon>
        </button>

        <mat-error>
          <app-form-error-required name="password"></app-form-error-required>
        </mat-error>
      </mat-form-field>

      <app-loading-button
        [isLoading]="isLoading"
        i18n="logIn@@logIn"
        width="100%"
        [disabled]="!loginForm.valid">
        Log in
      </app-loading-button>

      <button
        i18n="tryLoggingInWithDemoAccount@@tryLoggingInWithDemoAccount"
        class="mt-4"
        type="button"
        matButton="tonal"
        (click)="loginDemoClicked()">
        Try logging in with demo account
      </button>

      <a
        i18n="forgotPassword@@forgotPassword"
        class="mt-2 text-center"
        type="button"
        matButton
        routerLink="/forgot-password">
        Forgot Password?
      </a>
    </form>
  </div>
  <div class="mb-6 text-center" style="font: var(--mat-sys-body-small)">
    Copyright © 2026 All Rights Reserved. Isjhar Kautsar |
    {{ "isjhar@gmail.com" }}
  </div>
</div>
