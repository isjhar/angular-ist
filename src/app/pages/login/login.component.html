<div class="flex h-full w-full flex-col place-content-center items-center">
  <div class="flex w-full justify-end p-4">
    <app-localization-menu></app-localization-menu>
  </div>
  <div class="gap-lg flex flex-1 flex-col place-content-center items-center">
    <h1 i18n="welcomeToApp" class="text-display-small">Welcome to App</h1>
    <form
      class="gap-xs flex w-full max-w-[500px] flex-col place-content-center"
      [formGroup]="loginForm"
      (ngSubmit)="onLoginformSubmitted()">
      <mat-form-field appearance="fill" class="mb-2">
        <mat-label i18n="email">Email</mat-label>
        <input
          matInput
          type="email"
          name="email"
          id="email"
          formControlName="email"
          autocomplete="email"
          data-test="email" />
        @if (email.invalid && (email.dirty || email.touched)) {
          <mat-error>
            @if (email.hasError("required")) {
              <span i18n="fieldIsRequired">Field is required</span>
            }
          </mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label i18n="password">Password</mat-label>
        <input
          matInput
          type="password"
          name="password"
          id="password"
          formControlName="password"
          autocomplete="current-password"
          data-test="password" />

        <button
          matIconButton
          matSuffix
          appTogglePassword
          type="button"
          i18n-aria-label="togglePasswordVisibility@@togglePasswordVisibility"
          aria-label="Toggle password visibility">
          <mat-icon></mat-icon>
        </button>

        @if (password.invalid && (password.dirty || password.touched)) {
          <mat-error>
            @if (password.hasError("required")) {
              <span i18n="fieldIsRequired">Field is required</span>
            }
          </mat-error>
        }
      </mat-form-field>

      <app-loading-button
        [isLoading]="isLoading"
        i18n="logIn@@logIn"
        width="100%"
        [disabled]="!loginForm.valid"
        icon="login">
        Log in
      </app-loading-button>
    </form>

    <div class="gap-xs flex flex-col items-center">
      <button
        i18n="tryLoggingInWithDemoAccount@@tryLoggingInWithDemoAccount"
        class="mt-4"
        type="button"
        matButton="tonal"
        (click)="loginDemoClicked()">
        Try logging in with demo account
      </button>

      <a
        i18n="forgotPassword@@forgotPassword"
        class="mt-2 text-center"
        type="button"
        matButton
        routerLink="/forgot-password">
        Forgot Password?
      </a>
    </div>
  </div>
  <app-footer></app-footer>
</div>
