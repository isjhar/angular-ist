<button
  [matButton]="appearance"
  type="submit"
  [disabled]="disabled || isLoading"
  [ngStyle]="{ width: width }"
  [name]="name"
  [value]="value">
  <div class="row main-axis-center cross-axis-center" style="gap: 10px">
    @if (isLoading) {
      <mat-spinner [diameter]="14" style="margin: 0 auto"></mat-spinner>
    } @else {
      @if (icon) {
        <mat-icon>{{ icon }}</mat-icon>
      }
    }

    <ng-content></ng-content>
  </div>
</button>
